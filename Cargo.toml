[workspace]
resolver = "2"
members = [
  "crates/fu-core",
  "crates/fu-engine",
  "crates/fu-chart",
  "crates/fu-assets",
  "crates/fu-config",
  "crates/fu-storage",
  "crates/fu-benchmark",
  "crates/fu-bridge",
  "crates/fu-project",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
